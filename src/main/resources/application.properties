# Let unknown paths raise NoHandlerFoundException instead of the default
# container 404, so the global advice can render a navigable error resource.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Hypermedia API configuration (documented in README.md -> Configuration)
hypermedia.pagination.default-size=20
hypermedia.pagination.max-size=100
hypermedia.pagination.max-page=0
hypermedia.embedding.max-depth=3
hypermedia.representation.default-media-type=application/hal+json
hypermedia.data.seed-on-startup=true
