# ---------------------------------------------------------------------------
# Hypermedia Resource API configuration
# ---------------------------------------------------------------------------

# Maximum depth accepted for the "embed" / "embed-depth" query parameters.
# Paths deeper than this are truncated deterministically (see README).
hypermedia.embed-max-depth=3

# Default page size when the "size" query parameter is absent.
hypermedia.default-page-size=5

# Upper bound for the "size" query parameter; larger values are clamped.
hypermedia.max-page-size=20

# Optional external base prepended to every link href (empty = paths are
# application-root relative, e.g. "/orders/o-1"). Set to an absolute origin
# when the service runs behind a gateway: https://api.example.com
hypermedia.base-path=
